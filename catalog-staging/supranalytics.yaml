name: supranalytics
title: SuprAnalytics
repo: https://github.com/aniketmohite/supranalytics-plugin
sha: PENDING_SHA  # Replace with 40-character commit SHA after release push
description: >-
  Five analytics workflow skills for SuprAnalytics: weekly performance reports,
  traffic source analysis, funnel drop-off analysis, revenue attribution, and
  Core Web Vitals / audit review. Connects to the SuprAnalytics remote MCP
  server via OAuth. All access is read-only. Network destination:
  https://supranalytics.app/mcp. No credentials are stored in the plugin.
